name: CI/CD - Kubernetes Infra

on:
  workflow_dispatch:
  pull_request:
    branches: [main, hml]
  push:
    branches: [hml, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - name: Terraform fmt
        working-directory: terraform
        run: terraform fmt -recursive
      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        working-directory: terraform
        run: terraform validate -no-color

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.ENABLE_DEPLOY == 'true'
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'homologation' }}
    concurrency:
      group: terraform-k8s-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Bootstrap Terraform state bucket
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          TF_STATE_BUCKET="fiap-tech-challenge-tfstate-${ACCOUNT_ID}"

          if aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            echo "Terraform state bucket already exists."
          else
            echo "Creating Terraform state bucket: $TF_STATE_BUCKET"
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$TF_STATE_BUCKET" --region "$AWS_REGION"
            else
              aws s3api create-bucket \
                --bucket "$TF_STATE_BUCKET" \
                --region "$AWS_REGION" \
                --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi
          fi

          aws s3api put-public-access-block \
            --bucket "$TF_STATE_BUCKET" \
            --public-access-block-configuration \
            'BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true'

          aws s3api put-bucket-versioning \
            --bucket "$TF_STATE_BUCKET" \
            --versioning-configuration Status=Enabled

          aws s3api put-bucket-encryption \
            --bucket "$TF_STATE_BUCKET" \
            --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

          echo "TF_STATE_BUCKET=$TF_STATE_BUCKET" >> "$GITHUB_ENV"
          echo "## Terraform State" >> "$GITHUB_STEP_SUMMARY"
          echo "TF_STATE_BUCKET=$TF_STATE_BUCKET" >> "$GITHUB_STEP_SUMMARY"
          echo "TF_STATE_READY=true" >> "$GITHUB_STEP_SUMMARY"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Terraform init
        working-directory: terraform
        run: >-
          terraform init -input=false
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="key=oficina-k8s-infra/${{ github.ref_name }}/terraform.tfstate"
          -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}"
          -backend-config="encrypt=true"

      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
          TF_VAR_environment: ${{ github.ref_name == 'main' && 'prod' || 'hml' }}
        run: terraform apply -auto-approve -input=false

      - name: Publish infrastructure outputs
        working-directory: terraform
        run: |
          echo "## Kubernetes infrastructure" >> "$GITHUB_STEP_SUMMARY"
          echo "CLUSTER_NAME=$(terraform output -raw cluster_name)" >> "$GITHUB_STEP_SUMMARY"
          echo "VPC_ID=$(terraform output -raw vpc_id)" >> "$GITHUB_STEP_SUMMARY"
          echo "VPC_CIDR=$(terraform output -raw vpc_cidr)" >> "$GITHUB_STEP_SUMMARY"
          echo "PRIVATE_SUBNET_IDS=$(terraform output -json private_subnet_ids)" >> "$GITHUB_STEP_SUMMARY"
          echo "PUBLIC_SUBNET_IDS=$(terraform output -json public_subnet_ids)" >> "$GITHUB_STEP_SUMMARY"
          echo "NODE_SECURITY_GROUP_ID=$(terraform output -raw node_security_group_id)" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure kubectl
        working-directory: terraform
        run: |
          CLUSTER_NAME=$(terraform output -raw cluster_name)
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "${{ vars.AWS_REGION || 'us-east-1' }}"
          kubectl get nodes

      - name: Install metrics-server
        run: |
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/ --force-update
          helm upgrade --install metrics-server metrics-server/metrics-server \
            --namespace kube-system \
            --set-string 'args[0]=--kubelet-preferred-address-types=InternalIP\,Hostname\,ExternalIP'
          kubectl -n kube-system rollout status deployment/metrics-server --timeout=180s

      - name: Install Datadog Agent when configured
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: |
          if [ -z "$DD_API_KEY" ]; then
            echo "DD_API_KEY não configurada; Datadog será instalado após a chave ser adicionada." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          kubectl create namespace datadog --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n datadog create secret generic datadog-secret \
            --from-literal=api-key="$DD_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -
          helm repo add datadog https://helm.datadoghq.com --force-update
          helm upgrade --install datadog datadog/datadog \
            --namespace datadog \
            -f k8s/datadog-values.yaml
          kubectl -n datadog rollout status daemonset/datadog --timeout=300s || true
